<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cinephiles Areana</title>
  <meta name="description" content="Stream movies and TV shows instantly. Search, browse, and watch in HD." />
  <meta name="theme-color" content="#0a0a12" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- async: fonts must never block first paint (text shows in fallback until ready) -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" /></noscript>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="app">
    <header class="nav" id="nav">
      <a class="brand" href="#/">Cinephiles Areana</a>
      <nav class="nav-links" id="navLinks">
        <a href="#/movies" data-nav="movies">Movies</a>
        <a href="#/tv-shows" data-nav="tv">TV Shows</a>
        <a href="#/top-rated" data-nav="top">Top Rated</a>
        <a href="#/imdb75" data-nav="imdb75">IMDb 7.5+</a>
      </nav>
      <div class="search-box" id="searchBox">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="navSearch" type="text" placeholder="Search movies &amp; shows…" autocomplete="off" spellcheck="false" />
        <div class="search-dropdown" id="searchDropdown"></div>
      </div>
      <button class="icon-btn" id="searchToggle" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
    </header>

    <main id="view"></main>

  </div>

  <div class="toast" id="toast" hidden></div>

  <!-- hls.js is NOT here — it's lazy-loaded only when a watch page opens
       (browse/search pages skip ~400KB of parsing) -->
  <!-- ?v= busts the service-worker/HTTP caches on release — bump alongside sw.js CACHE -->
  <script src="/js/api.js?v=16"></script>
  <script src="/js/player.js?v=16"></script>
  <!-- render.js must load before router.js (shared SSR/client markup helpers) -->
  <script src="/js/render.js?v=16"></script>
  <script src="/js/router.js?v=16"></script>
  <script>
    // PWA: register the service worker (installable app + cached shell)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
